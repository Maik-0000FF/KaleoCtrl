[package]
name = "kaleoctrl"
version = "0.1.0"
edition = "2021"

[lib]
name = "kaleoctrl"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
whisper-rs = { version = "0.15", features = ["vulkan"] }
cpal = "0.17"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libssl-dev libvulkan-dev glslc \
            libasound2-dev libpulse-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --all

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: npm ci
        run: npm ci

      - name: vite build
        run: npm run build

  install-script:
    name: Install script (${{ matrix.distro }})
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            container: ''
          - distro: arch
            container: archlinux:latest
    # install.sh Mode 2 (Dev setup) runs:
    #   install_system_deps → install_rust → install_node → dev_mode
    # It does NOT build the app, so the matrix verifies that the per-distro
    # package names are valid and that `npm ci`/`npm run build` succeed.
    steps:
      - name: Bootstrap Arch container
        if: matrix.distro == 'arch'
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -S  --noconfirm --needed git sudo

      - uses: actions/checkout@v4

      - name: Sanity check install.sh
        run: bash -n install.sh

      - name: Run install.sh in dev-setup mode (option 2)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # install.sh prompts:
          #   1) mode selector  → "2" (Dev setup)
          #   2) "Continue? [Y/n]" before installing system packages → "Y"
          printf '2\nY\n' | bash install.sh

      - name: Verify expected toolchain is reachable
        run: |
          set -e
          if [ -f "$HOME/.cargo/env" ]; then
            # shellcheck disable=SC1091
            . "$HOME/.cargo/env"
          fi
          command -v node  && node  --version
          command -v npm   && npm   --version
          command -v rustc && rustc --version
          command -v cargo && cargo --version

      - name: Verify frontend artifacts
        run: |
          test -d node_modules         || (echo "node_modules/ missing — npm install did not run" && exit 1)
          test -f config/settings.json || (echo "config/settings.json missing" && exit 1)
          test -d models               || (echo "models/ directory missing" && exit 1)

  uninstall-script:
    name: Uninstall script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sanity check uninstall.sh
        run: bash -n uninstall.sh

      - name: Run sandbox test suite
        run: bash tests/test-uninstall.sh
